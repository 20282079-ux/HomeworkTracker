<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 'unsafe-inline' is still required by the inline onclick handlers.
       base-uri/object-src/worker-src are locked down, and no third-party
       script or network origin is allowed — everything but Google Fonts is
       self-hosted. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'self'; img-src 'self' data:;" />
  <title>Homework Tracker</title>

  <!-- PWA Meta -->
  <meta name="theme-color" content="#0e0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HW Tracker" />
  <meta name="description" content="Track your assignments with style — a beautiful, offline-ready homework planner" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Skip Navigation (Accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Live region for dynamic announcements -->
  <div id="toast-container" role="log" aria-live="polite" aria-atomic="false"></div>

  <div class="app">

    <!-- ═══ HEADER ═══ -->
    <header class="header">
      <div class="header-left">
        <h1 id="app-title">Homework <span>Tracker.</span></h1>
        <p class="header-sub" id="header-sub">Track your assignments with style</p>
      </div>
      <nav class="header-actions" aria-label="App actions">
        <button class="btn btn-ghost btn-sm" onclick="App.showKeybindsHelp()" id="keybinds-hint-btn" title="Keyboard shortcuts: N for new task, Ctrl+K for the command palette, Esc to close" aria-label="Keyboard shortcuts help">⌨ Shortcuts</button>
        <button class="btn btn-ghost btn-sm" onclick="App.toggleCompact()" id="compact-btn" title="Toggle compact view" aria-pressed="false">⊟ Compact</button>
        <button class="btn btn-ghost btn-sm" onclick="App.openSettings()" title="Customize settings">⚙ Customize</button>
        <button class="btn btn-primary" onclick="App.openAddForm()" id="add-btn">＋ Add Task</button>
      </nav>
    </header>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main id="main-content">

      <!-- ══ HOMEWORK PANEL ══ -->
      <section id="panel-hw" class="tab-panel active" role="tabpanel" aria-label="Assignments">

        <!-- Stats -->
        <div class="stats-row" role="group" aria-label="Assignment statistics">
          <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value accent" id="stat-total" aria-live="polite">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Done</div>
            <div class="stat-value success" id="stat-done" aria-live="polite">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Overdue</div>
            <div class="stat-value danger" id="stat-overdue" aria-live="polite">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Due Soon</div>
            <div class="stat-value warn" id="stat-soon" aria-live="polite">0</div>
          </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" role="group" aria-label="Overall progress">
          <div class="progress-label">
            <span>Overall Progress</span>
            <span id="pct-label">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Assignment completion progress">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar" role="search" aria-label="Filter and search assignments">
          <div class="filter-chips" id="filter-chips" role="group" aria-label="Subject filters">
            <button class="chip active" data-filter="All" onclick="App.setFilter(this)">All</button>
          </div>
          <label for="search-input" class="sr-only">Search assignments</label>
          <input class="search-input" type="search" placeholder="🔍 Search…" oninput="App.filterTasks()" id="search-input" aria-label="Search assignments" />
          <label for="sort-select" class="sr-only">Sort by</label>
          <select class="sort-select" onchange="App.filterTasks()" id="sort-select" aria-label="Sort assignments">
            <option value="created">Newest first</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
            <option value="subject">Subject</option>
            <option value="alpha">A–Z</option>
          </select>
          <label for="status-filter" class="sr-only">Filter by status</label>
          <select class="sort-select" onchange="App.filterTasks()" id="status-filter" aria-label="Filter by status">
            <option value="all">All status</option>
            <option value="pending">Pending</option>
            <option value="done">Completed</option>
          </select>
        </div>

        <!-- Tasks list -->
        <div id="tasks-list" class="tasks-list" role="list" aria-label="Assignments"></div>

      </section>

    </main>
  </div>

  <!-- ═══ ADD/EDIT TASK MODAL ═══ -->
  <div id="task-modal" class="overlay hidden" onclick="App.closeModalOutside(event)" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" id="task-modal-inner">
      <h2 class="modal-title" id="modal-title">📝 New Assignment</h2>
      <div class="form-grid">
        <div class="field">
          <label for="m-title">Assignment Title *</label>
          <input type="text" id="m-title" placeholder="e.g. Chapter 5 Problems" required aria-required="true" />
        </div>
        <div class="field">
          <label for="m-subject">Subject</label>
          <select id="m-subject"></select>
        </div>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label for="m-notes">Notes / Description</label>
        <textarea id="m-notes" placeholder="Any extra details…"></textarea>
      </div>
      <div class="form-grid-3">
        <div class="field">
          <label for="m-due">Due Date</label>
          <input type="date" id="m-due" />
        </div>
        <div class="field">
          <label for="m-priority">Priority</label>
          <select id="m-priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
        </div>
        <div class="field">
          <label for="m-time">Est. Time (min)</label>
          <input type="number" id="m-time" placeholder="30" min="1" max="999" />
        </div>
      </div>
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field">
          <label for="m-status">Status</label>
          <select id="m-status">
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="App.saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <!-- ═══ SETTINGS MODAL ═══ -->
  <div id="settings-modal" class="overlay hidden" onclick="App.closeSettingsOutside(event)" role="dialog" aria-modal="true" aria-label="Customize settings">
    <div class="modal" id="settings-modal-inner" style="max-width:520px">
      <h2 class="modal-title">🎨 Customize</h2>

      <!-- Theme Colors -->
      <div class="settings-section">
        <h3 class="settings-section-title">🎨 Theme Colors</h3>
        <div class="color-row">
          <label for="c-bg">Background</label>
          <input type="color" id="c-bg" oninput="App.applyColor('--bg', this.value)" aria-label="Background color" />
          <input type="text" id="ct-bg" oninput="App.syncColorText('--bg','c-bg','ct-bg')" aria-label="Background hex value" />
        </div>
        <div class="color-row">
          <label for="c-surface">Surface</label>
          <input type="color" id="c-surface" oninput="App.applyColor('--bg2', this.value)" aria-label="Surface color" />
          <input type="text" id="ct-surface" oninput="App.syncColorText('--bg2','c-surface','ct-surface')" aria-label="Surface hex value" />
        </div>
        <div class="color-row">
          <label for="c-accent">Accent / Primary</label>
          <input type="color" id="c-accent" oninput="App.applyColor('--accent', this.value); App.applyColor('--accent-glow', App.hexToRgba(this.value,0.18))" aria-label="Accent color" />
          <input type="text" id="ct-accent" oninput="App.syncColorText('--accent','c-accent','ct-accent')" aria-label="Accent hex value" />
        </div>
        <div class="color-row">
          <label for="c-text">Text Color</label>
          <input type="color" id="c-text" oninput="App.applyColor('--text', this.value)" aria-label="Text color" />
          <input type="text" id="ct-text" oninput="App.syncColorText('--text','c-text','ct-text')" aria-label="Text hex value" />
        </div>
        <div class="color-row">
          <label for="c-border">Border Color</label>
          <input type="color" id="c-border" oninput="App.applyColor('--border', this.value)" aria-label="Border color" />
          <input type="text" id="ct-border" oninput="App.syncColorText('--border','c-border','ct-border')" aria-label="Border hex value" />
        </div>
      </div>

      <!-- Presets -->
      <div class="settings-section">
        <h3 class="settings-section-title">✨ Theme Presets</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('midnight')">🌙 Midnight</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('forest')">🌿 Forest</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('ocean')">🌊 Ocean</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('sunset')">🌅 Sunset</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('rose')">🌸 Rose</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('light')">☀️ Light</button>
          <button class="btn btn-ghost btn-sm" onclick="App.applyPreset('coffee')">☕ Coffee</button>
        </div>
      </div>

      <!-- Subjects -->
      <div class="settings-section">
        <h3 class="settings-section-title">📚 Subjects</h3>
        <div id="subject-list"></div>
        <div class="add-subject-row" style="margin-top:10px;gap:8px;display:flex">
          <label for="new-subject-name" class="sr-only">New subject name</label>
          <input type="text" id="new-subject-name" placeholder="New subject…"
            style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none"
            onkeydown="if(event.key==='Enter')App.addSubject()" />
          <label for="new-subject-color" class="sr-only">New subject color</label>
          <input type="color" id="new-subject-color" value="#7c6af7" style="width:44px;height:44px;border:none;border-radius:8px;padding:3px;background:var(--surface2);cursor:pointer" />
          <button class="btn btn-primary btn-sm" onclick="App.addSubject()">Add</button>
        </div>
      </div>

      <!-- Sound -->
      <div class="settings-section">
        <h3 class="settings-section-title">🔊 Sound</h3>
        <div class="toggle-row">
          <label for="s-sound">Task-completion sound 🔊</label>
          <label class="toggle"><input type="checkbox" id="s-sound" onchange="App.toggleSoundFromSettings(this)"><span class="toggle-slider"></span></label>
        </div>
      </div>

      <div class="settings-section">
        <h3 class="settings-section-title">⚙️ Settings</h3>
        <div class="toggle-row">
          <label for="s-show-done">Show completed tasks</label>
          <label class="toggle"><input type="checkbox" id="s-show-done" checked onchange="App.filterTasks()"><span class="toggle-slider"></span></label>
        </div>
        <div class="toggle-row">
          <label for="s-compact">Compact view</label>
          <label class="toggle"><input type="checkbox" id="s-compact" onchange="App.toggleCompactFromSettings(this)"><span class="toggle-slider"></span></label>
        </div>
        <div class="toggle-row">
          <label for="s-confetti">Confetti on completion 🎉</label>
          <label class="toggle"><input type="checkbox" id="s-confetti" checked><span class="toggle-slider"></span></label>
        </div>
        <div class="toggle-row">
          <label for="s-group">Group tasks by subject</label>
          <label class="toggle"><input type="checkbox" id="s-group" onchange="App.filterTasks()"><span class="toggle-slider"></span></label>
        </div>
        <div style="margin-top:8px">
          <label for="s-radius" style="font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);font-weight:600;display:block;margin-bottom:8px">Border Radius: <span id="radius-val">14px</span></label>
          <input type="range" min="0" max="28" value="14" id="s-radius" oninput="App.applyRadius(this.value)" />
        </div>
      </div>

      <!-- Rename + Data -->
      <div class="settings-section">
        <h3 class="settings-section-title">📝 App Title</h3>
        <div class="field" style="margin-bottom:12px">
          <label for="s-title" class="sr-only">App title</label>
          <input type="text" id="s-title" placeholder="App title…" value="Homework Tracker" oninput="App.updateTitle(this.value)" style="background:var(--surface2)" />
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap">
        <button class="btn btn-danger btn-sm" onclick="App.clearAllTasks()">🗑 Clear All Tasks</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="App.resetSettings()">↺ Reset Theme</button>
          <button class="btn btn-primary" onclick="App.closeSettings()">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ COMMAND PALETTE ═══ -->
  <div id="command-palette" class="cmd-palette-overlay hidden" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-modal">
      <div class="cmd-palette-header">
        <span class="cmd-palette-icon">⌘</span>
        <input type="text" id="cmd-palette-input" class="cmd-palette-input" placeholder="Type a command…" autocomplete="off" aria-label="Search commands" />
        <kbd class="cmd-palette-kbd">Esc</kbd>
      </div>
      <div id="cmd-palette-results" class="cmd-palette-results" role="listbox" aria-label="Command results"></div>
      <div class="cmd-palette-footer">
        <span>↑↓ navigate</span>
        <span>↵ select</span>
        <span>Esc close</span>
      </div>
    </div>
  </div>

  <!-- ═══ MODULAR JS LOAD ORDER ═══ -->
  <script src="js/state.js"></script>
  <script src="js/util.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/command-palette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
